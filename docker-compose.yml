services:
  redis:
    image: redis:latest
    container_name: thanos-redis
    ports:
      - "46379:6379"
    volumes:
      - redis-data:/data
    networks:
      - thanos-network

  postgres:
    image: postgres:latest
    container_name: thanos-postgres
    ports:
      - "45432:5432"
    volumes:
      - postgres-data:/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - thanos-network

  chatbot-web:
    container_name: thanos-chatbot-web
    build:
      context: ./eddi-chatbot-web
      dockerfile: Dockerfile
      args:
        BUILD_MODE: development
    ports:
      - "43000:3000"
    volumes:
      - ./eddi-chatbot-web/src:/app/src:ro
      - ./eddi-chatbot-web/public:/app/public:ro
    environment:
      - NODE_ENV=development
      - PORT=3000
      - VITE_NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    networks:
      - thanos-network

  chatbot-api:
    container_name: thanos-chatbot-api
    build:
      context: ./eddi-chatbot-api
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports:
      - "48000:8000"
    volumes:
      - ./eddi-chatbot-api/main.py:/app/main.py:ro
      - ./eddi-chatbot-api/app:/app/app:ro
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DB_HOST=thanos-postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    networks:
      - thanos-network

  chatbot-worker:
    container_name: thanos-chatbot-worker
    build:
      context: ./eddi-chatbot-api
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "procrastinate",
        "--app=app.worker.task_app",
        "worker",
      ]
    volumes:
      - ./eddi-chatbot-api/main.py:/app/main.py:ro
      - ./eddi-chatbot-api/app:/app/app:ro
    environment:
      - DB_HOST=thanos-postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    networks:
      - thanos-network

