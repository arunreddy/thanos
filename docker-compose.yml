services:
  redis:
    image: redis:latest
    container_name: thanos-redis
    ports:
      - "46379:6379"
    volumes:
      - redis-data:/data
    networks:
      - thanos-network

  postgres:
    image: postgres:15
    container_name: thanos-postgres
    ports:
      - "45432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thanos-network

  chatbot-web:
    container_name: thanos-chatbot-web
    build:
      context: ./eddi-chatbot-web
      dockerfile: Dockerfile
    ports:
      - "43000:3000"
    volumes:
      - ./eddi-chatbot-web/src:/app/src:ro
      - ./eddi-chatbot-web/public:/app/public:ro
    environment:
      - NODE_ENV=development
      - PORT=3000
      - VITE_NODE_ENV=development
      - VITE_API_URL=http://localhost:48000
      - API_PROXY_TARGET=http://chatbot-api:8000
    depends_on:
      - chatbot-api
      - postgres
    restart: unless-stopped
    networks:
      - thanos-network

  chatbot-api:
    container_name: thanos-chatbot-api
    build:
      context: ./eddi-chatbot-api
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports:
      - "48000:8000"
    volumes:
      - ./eddi-chatbot-api/main.py:/app/main.py:ro
      - ./eddi-chatbot-api/app:/app/app:ro
    environment:
      - NODE_ENV=development
      - PORT=8000
      - EDDI_CHATBOT_APP_URL=http://localhost:43000
      - DB_HOST=thanos-postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=thanos-redis
      - REDIS_PORT=6379
      # Mock mode for local development - returns mock data instead of calling external APIs
      - USE_MOCK_DATA=true
      # Optional: DBQ API configuration (set these if using database query service)
      - DBQ_API_BASE_URL=
      - DBQ_API_TIMEOUT=30.0
      - DBQ_API_AUTH_TOKEN=
      - DBQ_API_CLIENT_APP_NAME=thanos
      # Optional: DataDog configuration (set these for monitoring)
      - DD_API_KEY=
      - DD_APP_KEY=
      # Optional: Okta configuration (set these for authentication)
      - EDDI_OKTA_CLIENT_ID=
      - EDDI_OKTA_CLIENT_SECRET=
      - EDDI_OKTA_REDIRECT_URI=http://localhost:43000/auth/callback
      - EDDI_SESSION_SECRET_KEY=dev-session-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - thanos-network

  chatbot-worker:
    container_name: thanos-chatbot-worker
    build:
      context: ./eddi-chatbot-api
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "procrastinate",
        "--app=app.worker.task_app",
        "worker",
      ]
    volumes:
      - ./eddi-chatbot-api/main.py:/app/main.py:ro
      - ./eddi-chatbot-api/app:/app/app:ro
    environment:
      - DB_HOST=thanos-postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=thanos-redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - thanos-network

