# domain.yml
version: "3.1"

intents:
  - greet
  - goodbye
  - help
  - help_website
  - restart
  - recommend_database
  - create_database
  - delete_database
  - out_of_scope
  - inform_database_version
  - confirm_database_selection
  - unsupported_db_type
  - affirm_delete
  - affirm
  - deny
  - explore_schema
  - affirm_schema
  - provide_schema_selection
  - analyze_query
  - affirm_query_analyzer
  - inform
  - get_patch_information
  - inform_hostname
  - create_column
  - affirm_create_column
  - confirm_column_creation
  - drop_column
  - affirm_drop_column
  - confirm_drop_column
  - db_metrics_summary

entities:
  - database_name
  - database_instance
  - database_version
  - sysid
  - app_architect
  - is_reviewed
  - epic_link
  - has_sysid
  - data_nature
  - data_structure
  - app_type
  - acid_compliance
  - is_open_source
  - ms_licensing
  - vendor_recommended_db
  - database_type 
  - database_size_large
  - hostname

forms:
  recommend_database_form:
    required_slots:
      - app_architect
      - is_reviewed
      - epic_link
      - has_sysid
      - data_nature
      # - data_structure
      # - app_type
      # - acid_compliance
      # - is_open_source
      # - ms_licensing
      # - vendor_recommended_db

  create_database_form:
    required_slots:
      - database_name
      - database_version
      - sysid

  delete_database_form:
    required_slots:
      - database_name
      - database_instance
      - sysid

  explore_schema_form:
    required_slots:
      - connection_string
      - selected_schemas 
      - object_types

  analyze_query_form:
    required_slots:
      - connection_string
      - sql_query

#create-column
  create_column_form:
    required_slots:
      - database_type
      - connection_string
      - table_name
      - column_name
      - column_type
      - is_primary_key
      - default_value

#drop-column
  drop_column_form:
    required_slots:
      - database_type
      - connection_string
      - selected_table
      - column_to_drop

  db_metrics_form:
    required_slots:
      - metrics_hostname
      - resource_name
      - time_period

slots:
  app_architect:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: recommend_database_form
            requested_slot: app_architect

  is_reviewed:
    type: text
    mappings:
      - type: from_entity
        entity: is_reviewed
      - type: from_text
        conditions:
          - active_loop: recommend_database_form
            requested_slot: is_reviewed

  epic_link:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: recommend_database_form
            requested_slot: epic_link

  has_sysid:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: recommend_database_form
            requested_slot: has_sysid

  data_nature:
    type: text
    mappings:
      - type: from_entity
        entity: data_nature

  data_structure:
    type: text
    mappings:
      - type: from_entity
        entity: data_structure

  app_type:
    type: text
    mappings:
      - type: from_entity
        entity: app_type

  acid_compliance:
    type: text
    mappings:
      - type: from_entity
        entity: acid_compliance

  is_open_source:
    type: text
    mappings:
      - type: from_entity
        entity: is_open_source

  ms_licensing:
    type: text
    mappings:
      - type: from_entity
        entity: ms_licensing

  vendor_recommended_db:
    type: text
    mappings:
      - type: from_entity
        entity: vendor_recommended_db

  ticket_id:
    type: text
    influence_conversation: false
    mappings: []

  recommended_database:
    type: text
    influence_conversation: false
    mappings: []

  database_size_large:
    type: text
    mappings:
      - type: from_entity
        entity: database_size_large

  database_type:
    type: text
    mappings:
      - type: from_entity
        entity: database_type
        intent: affirm_schema  
      - type: from_entity  
        entity: database_type
        intent: affirm_query_analyzer
      - type: from_entity
        entity: database_type
        intent: inform 
      - type: from_entity
        entity: database_type
        intent: affirm_create_column
      - type: from_entity
        entity: database_type
        intent: affirm_drop_column
      - type: from_text
        conditions:
          - active_loop: create_column_form
            requested_slot: database_type
      - type: from_text
        conditions:
          - active_loop: drop_column_form
            requested_slot: database_type
      

  # — create/delete-database form slots —
  database_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: create_database_form
            requested_slot: database_name
          - active_loop: delete_database_form
            requested_slot: database_name

  database_version:
    type: text
    mappings:
      - type: from_entity    # pull from the inform_database_version intent
        entity: database_version
        conditions:
          - active_loop: create_database_form
            requested_slot: database_version
      - type: from_text
        conditions:
          - active_loop: create_database_form
            requested_slot: database_version

  database_instance:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: delete_database_form
            requested_slot: database_instance

  sysid:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: create_database_form
            requested_slot: sysid
          - active_loop: delete_database_form
            requested_slot: sysid

  confirmed:
    type: bool
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: affirm
        value: true
        conditions:
          - active_loop: null
            requested_slot: null
      - type: from_intent
        intent: deny
        value: false
        conditions:
          - active_loop: null
            requested_slot: null

# schema-explorer
  connection_string:
    type: text
    mappings:
      # Existing mapping for explore_schema_form
      - type: from_text
        conditions:
          - active_loop: explore_schema_form
            requested_slot: connection_string
      # new mapping for analyze_query_form
      - type: from_text
        conditions:
          - active_loop: analyze_query_form
            requested_slot: connection_string
      # NEW MAPPING for create_column_form
      - type: from_text
        conditions:
          - active_loop: create_column_form
            requested_slot: connection_string     
      # NEW MAPPING for drop_column_form:
      - type: from_text
        conditions:
          - active_loop: drop_column_form
            requested_slot: connection_string

  object_types:
    type: list
    mappings:
      - type: from_text
        conditions:
          - active_loop: explore_schema_form
            requested_slot: object_types

  schema_file_path:
    type: text
    influence_conversation: false
    mappings: []

  definitions_file_path:
    type: text
    influence_conversation: false
    mappings: []

  selected_schemas:
    type: list
    mappings:
      - type: from_text
        conditions:
          - active_loop: explore_schema_form
            requested_slot: selected_schemas

  database_host_endpoint:
    type: text
    influence_conversation: false
    mappings: []

  available_objects:
    type: any
    influence_conversation: false
    mappings: []
  
  filtered_objects:
    type: any
    influence_conversation: false
    mappings: []
  
  object_definitions:
    type: any
    influence_conversation: false
    mappings: []
  
  object_definitions_url:
    type: text
    influence_conversation: false
    mappings: []

  sql_query:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: analyze_query_form
            requested_slot: sql_query

  execution_plan_path:
    type: text
    influence_conversation: false
    mappings: []

  execution_plan_data:
    type: any
    influence_conversation: false
    mappings: []

  hostname:
    type: text
    mappings:
      - type: from_entity
        entity: hostname
      - type: from_text
        conditions:
          - active_loop: null
            requested_slot: hostname
        not_intent:
          - affirm
          - deny
          - help
          - create_database
          - delete_database
          - explore_schema
          - analyze_query
          - create_column
          - drop_column
          - recommend_database
          - db_metrics_summary
          - affirm_create_column
          - affirm_drop_column
          - affirm_schema
          - affirm_query_analyzer
          - affirm_delete
          - confirm_column_creation
          - confirm_drop_column


# create-column
  table_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: create_column_form
            requested_slot: table_name

  column_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: create_column_form
            requested_slot: column_name

  column_type:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: create_column_form
            requested_slot: column_type

  is_primary_key:
    type: bool
    mappings:
      - type: from_text
        conditions:
          - active_loop: create_column_form
            requested_slot: is_primary_key

  default_value:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: create_column_form
            requested_slot: default_value

  query_id:
    type: text
    influence_conversation: false
    mappings: []

  query_status:
    type: text
    influence_conversation: false
    mappings: []

# drop-column

  selected_table:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: drop_column_form
            requested_slot: selected_table

  column_to_drop:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: drop_column_form
            requested_slot: column_to_drop

  drop_query:
    type: text
    influence_conversation: false
    mappings: []

  available_columns:
    type: list
    influence_conversation: false
    mappings: []

#db metrics

  metrics_hostname:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: db_metrics_form
            requested_slot: metrics_hostname

  resource_name:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: db_metrics_form
            requested_slot: resource_name

  time_period:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: db_metrics_form
            requested_slot: time_period

  metrics_data:
    type: any
    influence_conversation: false
    mappings: []

responses:
  utter_greet:
    - text: "Hello! How can I help you today?"

  utter_goodbye:
    - text: "Goodbye! Have a nice day."

  utter_help:
    - text: |
        Hello! I'm your Database Observability Assistant. I can help you manage databases, analyze performance, and explore schemas across PostgreSQL, MySQL, and MongoDB.

        Choose an option below to get started:
      buttons:
        - title: "Recommend a Database"
          payload: "/recommend_database"
        - title: "Create Database"
          payload: "/create_database"
        - title: "Delete Database"
          payload: "/delete_database"
        - title: "Schema Explorer"
          payload: "/explore_schema"
        - title: "Query Analyzer"
          payload: "/analyze_query"
        - title: "Create Column"
          payload: "/create_column"
        - title: "Drop Column"
          payload: "/drop_column"
        - title: "DB Metrics Summary"
          payload: "/db_metrics_summary"

  utter_help_website:
    - text: |
        Here’s what I can do:
        1. Recommend a database.  
        2. Provision (create) a new database.  
        3. Decommission (delete) a database.
        4. Explore database schema.
        5. Analyze SQL query performance.
        6. Create a new column in an existing table.
        7. Drop a column from an existing table.
        8. Get database metrics summary.


  utter_ask_app_architect:
    - text: "Please provide the Application Architect or Experience Owner name."

  utter_ask_is_reviewed:
    - text: "Is the solution reviewed with Architecture review board?"
      buttons:
        - title: "Yes"
          payload: '/inform{{"is_reviewed":"Yes"}}'
        - title: "No"
          payload: '/inform{{"is_reviewed":"No"}}'

  utter_ask_has_sysid:
    - text: "Do you have SYSID or Business mapping information for the Application? If yes, please share (if no, type 'No'):"

  utter_ask_app_type:
    - text: "Is it a Vendor Application (COTS) or CFG developed?"
      buttons:
        - title: "Vendor Application (COTS)"
          payload: '/inform{{"app_type":"Vendor Application"}}'
        - title: "CFG developed"
          payload: '/inform{{"app_type":"CFG Developed"}}'

  utter_ask_acid_compliance:
    - text: "Does your application need strict ACID SQL compliance or have complex queries (multi-join)?"
      buttons:
        - title: "Yes"
          payload: '/inform{{"acid_compliance":"Yes"}}'
        - title: "No"
          payload: '/inform{{"acid_compliance":"No"}}'

  utter_ask_data_nature:
    - text: "Can you provide the nature of the data you intend to store in your Database?"
      buttons:
        - title: "Transactional (OLTP)"
          payload: '/inform{{"data_nature":"Transactional"}}'
        - title: "Analytics (OLAP)"
          payload: '/inform{{"data_nature":"Analytics"}}'

  utter_ask_data_structure:
    - text: "How do you define your Data?"
      buttons:
        - title: "Structured / relational"
          payload: '/inform{{"data_structure":"Structured"}}'
        - title: "Unstructured"
          payload: '/inform{{"data_structure":"Unstructured"}}'

  utter_ask_vendor_recommended_db:
    - text: "Does the vendor recommend any database types?"
      buttons:
        - title: "Yes (Oracle/Postgres)"
          payload: '/inform{{"vendor_recommended_db":"Yes"}}'
        - title: "No"
          payload: '/inform{{"vendor_recommended_db":"No"}}'

  utter_ask_is_open_source:
    - text: "Is your application open-source?"
      buttons:
        - title: "Yes"
          payload: '/inform{{"is_open_source":"Yes"}}'
        - title: "No"
          payload: '/inform{{"is_open_source":"No"}}'

  utter_ask_ms_licensing:
    - text: "Does it have any Microsoft-licensing or Windows-infrastructure dependency?"
      buttons:
        - title: "Yes"
          payload: '/inform{{"ms_licensing":"Yes"}}'
        - title: "No"
          payload: '/inform{{"ms_licensing":"No"}}'

  utter_ask_database_size_large:
    - text: "Is estimated size of database going to be more than 300 GB in next 3-5 Years?"
      buttons:
        - title: "Yes"
          payload: '/inform{{"database_size_large":"Yes"}}'
        - title: "No"
          payload: '/inform{{"database_size_large":"No"}}'

  utter_available_soon:
    - text: "This feature is under development, will be available soon."

  utter_contact_dba_team:
    - text: "Require additional review; please contact DBA Team – dl-edsdelivery@citizensbank.com."

  
  utter_ask_epic_link:
    - text: "Please provide the Epic/Initiative link."

  # — create-database form prompts —
  utter_ask_database_name:
    - text: "Could you please provide the name of the database."

  utter_ask_database_version:
      - text: "Which version do you need?"
        buttons:
          - title: "PostgreSQL 15"
            payload: '/inform_database_version{"database_version":"postgresql15"}'
          - title: "PostgreSQL 16"
            payload: '/inform_database_version{"database_version":"postgresql16"}'

  utter_ask_sysid:
    - text: "Please provide the SYSID for your database."

  utter_submit_database:
    - text: |
        ## ✅ Database Creation Request Submitted
        
        Your request has been successfully submitted with the following details:
        - **Database Name:** `{database_name}`
        - **Version:** `{database_version}`
        - **SYSID:** `{sysid}`
        
        You will receive updates on the provisioning process soon!

  utter_ask_confirm_database_creation:
    - text: |
        ## 🗄️ Database Creation Confirmation
        
        You're about to create a database with these details:
        
        ### Database Configuration
        - **Name:** `{database_name}`
        - **Version:** `{database_version}`
        - **SYSID:** `{sysid}`
        
        Would you like to proceed with this database creation?
      buttons:
        - title: "Yes, create the database"
          payload: "/affirm"
        - title: "No, start over"
          payload: "/deny"

  # — delete-database confirmation —
  utter_confirm_delete_database:
    - text: |
        ## ✅ Database Deletion Request Submitted
        
        Your deletion request has been processed:
        - **Database:** `{database_name}` ({database_version})
        - **SYSID:** `{sysid}`
        
        The database will be safely decommissioned according to our deletion procedures.

  utter_ask_database_instance:
    - text: "Please provide the database instance you want to delete."

  utter_ask_confirm_database_deletion:
    - text: |
        ## ⚠️ Database Deletion Confirmation
        
        **WARNING:** You're about to permanently delete a database!
        
        ### Database Details
        - **Name:** `{database_name}`
        - **Instance:** `{database_instance}`
        - **SysID:** `{sysid}`
        
        ⚠️ **This action cannot be undone!** Are you sure you want to proceed?
      buttons:
        - title: "Yes, delete it"
          payload: "/affirm"
        - title: "No, cancel"
          payload: "/deny"

  utter_database_creation_cancelled:
    - text: "Database creation has been cancelled. What would you like to do next?"
      buttons:
        - title: "Try again"
          payload: "/create_database"
        - title: "Help"
          payload: "/help"

  utter_oos:
    - text: |
        ## 🤔 I didn't understand that
        
        I'm sorry, but that request is outside my area of expertise. I'm specifically designed to help with **database-related tasks**.
        
        ### What I can help with:
        • Database recommendations
        • Database provisioning and decommissioning  
        • Schema exploration
        • Query performance analysis
        
        Try typing **`/help`** to see all available options!

  utter_database_selection_confirmation:
    - text: "Would you like to proceed with this recommendation?"
      buttons:
        - title: "Yes, create ticket"
          payload: "/confirm_database_selection"
        - title: "No, let's try again"
          payload: "/restart"

  utter_postgresql_support:
    - text: |
        Which database type would you like?  
        We currently support only **PostgreSQL**.  
        Other types will be available later.  
        For any further questions, email 'dl-edsdelivery@citizensbank.com'.
      buttons:
        - title: "PostgreSQL"
          payload: "/affirm"
        - title: "MySQL"
          payload: "/unsupported_db_type"
        - title: "MongoDB"
          payload: "/unsupported_db_type"
        - title: "Oracle"
          payload: "/unsupported_db_type"

  utter_postgresql_support_delete:
    - text: |
        Which database type would you like?  
        We currently support only **PostgreSQL**.  
        Other types will be available later.  
        For any further questions, email 'dl-edsdelivery@citizensbank.com'.
      buttons:
        - title: "PostgreSQL"
          payload: "/affirm_delete"
        - title: "MySQL"
          payload: "/unsupported_db_type"
        - title: "MongoDB"
          payload: "/unsupported_db_type"
        - title: "Oracle"
          payload: "/unsupported_db_type"

  utter_working_on_features:
    - text: |
        Sorry, we’re still working on those database types.  
        They’ll be available soon!  

#schema-explorer
  utter_postgresql_support_schema:
    - text: |
        Which database type would you like to explore?  
        We support **PostgreSQL**, **MySQL**, and **MongoDB**.
      buttons:
        - title: "PostgreSQL"
          payload: '/affirm_schema{{"database_type":"PostgreSQL"}}'
        - title: "MySQL"
          payload: '/affirm_schema{{"database_type":"MySQL"}}'
        - title: "MongoDB"
          payload: '/affirm_schema{{"database_type":"MongoDB"}}'
        - title: "Oracle"
          payload: "/unsupported_db_type"

  utter_ask_connection_string:
    - text: |
        Please provide the connection string in the appropriate format:

        ### PostgreSQL
        ```
        postgres://username:password@host:port/database_name
        ```

        ### MySQL
        ```
        mysql://username:password@host:port/database_name
        ```

        ### MongoDB
        ```
        mongodb://username:password@host:port/database_name
        ```

  utter_ask_connection_string_postgresql:
    - text: |
        Please provide the PostgreSQL connection string in the format:
        
        ### PostgreSQL
        ```
        postgres://username:password@host:port/database_name
        ```

  utter_ask_connection_string_mysql:
    - text: |
        Please provide the MySQL connection string in the format:
        
        ### MySQL
        ```
        mysql://username:password@host:port/database_name
        ```

  utter_ask_connection_string_mongodb:
    - text: |
        Please provide the MongoDB connection string in the format:
        
        ### MongoDB
        ```
        mongodb://username:password@host:port/database_name
        ```

  utter_ask_connection_string_redshift:
    - text: |
        Please provide the Redshift connection string in the format:
        
        ### Redshift
        ```
        redshift://username:password@host:port/database_name
        ```

  utter_invalid_connection_string:
    - text: "That doesn’t look like a valid PostgreSQL connection string. Please try again in the correct format."

  utter_ask_object_types:
    - text: |
        ## 🗂️ Object Type Selection
        
        Which database object types would you like to explore?
        
        **Examples:** `tables`, `views`, `functions`, `sequences`, `indexes`, `triggers`
        
        You can specify multiple types separated by commas.

  utter_ask_confirm_schema_explore:
    - text: |
        ## 🔍 Schema Exploration Confirmation
        
        Ready to explore your database schema with these settings:
        
        ### Configuration
        - **Database Type:** {database_type}  
        - **Connection:** `{connection_string}`  
        - **Selected Schemas:** `{selected_schemas}`
        - **Object Types:** `{object_types}`  

        Would you like to proceed with the schema exploration?
      buttons:
        - title: "Yes"
          payload: "/affirm"
        - title: "No"
          payload: "/deny"

  utter_schema_download:
    - text: "Here’s your schema! [Download link]"

  utter_cancel_schema_explore:
    - text: "Schema exploration has been cancelled. Let me know if you need anything else."

  utter_ask_selected_schemas:
    - text: " "

  utter_ask_for_schema_selection:
    - text: |
        Select the objects for which you want detailed definitions

#query-analyzer
  utter_ask_sql_query:
    - text: |
        ## 📝 SQL Query Input
        
        Please enter the SQL query you want to analyze.
        
        **I can help with:**
        • Performance optimization suggestions
        • Execution plan analysis  
        • Index recommendations
        • Query structure improvements

  utter_postgresql_support_query_analyzer:
    - text: |
        Which database type would you like to analyze?  
        We support **PostgreSQL**, **MySQL**, and **MongoDB**.
      buttons:
        - title: "PostgreSQL"
          payload: '/affirm_query_analyzer{{"database_type":"PostgreSQL"}}'
        - title: "MySQL"
          payload: '/affirm_query_analyzer{{"database_type":"MySQL"}}'
        - title: "MongoDB"
          payload: '/affirm_query_analyzer{{"database_type":"MongoDB"}}'
        - title: "SQL Server"
          payload: "/unsupported_db_type"
        - title: "DB2"
          payload: "/unsupported_db_type"

  utter_ask_confirm_query_analysis:
    - text: |
        ## 🔍 Query Analysis Confirmation
        
        Ready to analyze your SQL query for performance insights:
        
        ### Query to Analyze
        ```sql
        {sql_query}
        ```
        
        I'll provide execution plan analysis, performance recommendations, and optimization suggestions.
        
        Would you like to proceed?
      buttons:
        - title: "Yes"
          payload: "/affirm"
        - title: "No"
          payload: "/deny"

  utter_query_analysis_cancelled:
    - text: "Query analysis has been cancelled. What would you like to do next?"
      buttons:
        - title: "Try again"
          payload: "/analyze_query"
        - title: "Help"
          payload: "/help"

#patch-information
  utter_ask_hostname:
    - text: "Please provide the hostname for which you want patch information."

  utter_confirm_hostname:
    - text: "I'll look up patch information for hostname: **{hostname}**. Is this correct?"
      buttons:
        - title: "Yes, proceed"
          payload: "/affirm"
        - title: "No, change hostname"
