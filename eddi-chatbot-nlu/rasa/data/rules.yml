# ——— create‐database form ———
  # 1) when the user says “create_database” first warn that only Postgres is supported
  - rule: postgres support notice for create database
    steps:
      - intent: create_database
      - action: utter_postgresql_support
      - action: action_listen

  # 1a) if they click any unsupported type…
  - rule: unsupported database type selected
    steps:
      - intent: unsupported_db_type
      - action: utter_working_on_features
      - action: action_listen

  # 2) once they affirm, activate the create-database form
  - rule: activate create database form after support affirmation
    steps:
      - intent: affirm
      - action: create_database_form
      - active_loop: create_database_form

  # 3) when the form is filled (sysid set), ask for final confirmation
  - rule: submit create database form
    condition:
      - active_loop: create_database_form
      - slot_was_set:
          - sysid
    steps:
      - action: create_database_form
      - active_loop: null
      - action: utter_ask_confirm_database_creation
      - action: action_listen

  # 4) if they then affirm with all slots present, actually provision
  - rule: handle affirm for database creation
    condition:
      - active_loop: null
      - slot_was_set:
          - database_name
          - database_version
          - sysid
    steps:
      - intent: affirm
      - action: action_submit_database

  # 5) if they deny at that confirm screen, cancel creation
  - rule: handle deny for database creation
    condition:
      - active_loop: null
      - slot_was_set:
          - database_name
          - database_version
          - sysid
    steps:
      - intent: deny
      - action: utter_database_creation_cancelled

# ——— delete‐database form ———

# 1) when the user says “delete_database” first warn that only Postgres is supported
  - rule: postgres support notice for delete database
    steps:
      - intent: delete_database
      - action: utter_postgresql_support_delete
      - action: action_listen

# 1a) catch unsupported-DB clicks from that notice only
  - rule: activate delete database form after support affirmation
    steps:
      - intent: affirm_delete
      - action: delete_database_form
      - active_loop: delete_database_form

# 3) when the form is filled (sysid set), ask for final confirmation
  - rule: submit delete database form
    condition:
      - active_loop: delete_database_form
      - slot_was_set:
          - sysid
    steps:
      - action: delete_database_form
      - active_loop: null
      - action: utter_ask_confirm_database_deletion
      - action: action_listen

# 4) if they then affirm, actually delete
  - rule: handle affirm for database deletion
    condition:
      - active_loop: null
      - slot_was_set:
          - database_name
          - database_instance
          - sysid
    steps:
      - intent: affirm
      - action: action_submit_delete_database

# 5) if they deny, cancel deletion
  - rule: handle deny for database deletion
    condition:
      - active_loop: null
      - slot_was_set:
          - database_name
          - database_instance
          - sysid
    steps:
      - intent: deny
      - action: utter_database_creation_cancelled  # or create your own “cancelled delete” utter


  # Schema Explorer Rules
  - rule: database support notice for exploring schema
    steps:
      - intent: explore_schema
      - action: utter_postgresql_support_schema
      - action: action_listen

  - rule: activate explore‐schema form after support affirmation
    steps:
      - intent: affirm_schema
      - action: explore_schema_form
      - active_loop: explore_schema_form

  - rule: unsupported database type selected during schema explore
    steps:
      - intent: unsupported_db_type
      - action: utter_working_on_features
      - action: action_listen

  - rule: submit explore‐schema form
    condition:
      - active_loop: explore_schema_form
      - slot_was_set:
          - object_types
    steps:
      - action: explore_schema_form
      - active_loop: null
      - action: utter_ask_confirm_schema_explore
      - action: action_listen

  - rule: handle affirm for schema exploration
    condition:
      - active_loop: null
      - slot_was_set:
          - connection_string
          - object_types
    steps:
      - intent: affirm
      - action: action_submit_schema_explore
      - action: action_fetch_available_objects
      - action: utter_ask_for_schema_selection

  - rule: handle deny for schema exploration
    condition:
      - active_loop: null
      - slot_was_set:
          - connection_string
          - object_types
    steps:
      - intent: deny
      - action: utter_cancel_schema_explore

  - rule: generate schema definitions when user provides selection
    condition:
      - slot_was_set:
          - connection_string
          - schema_file_path
    steps:
      - intent: provide_schema_selection
      - action: action_fetch_object_definitions

  # Query Analyzer Rules
  - rule: database support notice for analyzing query
    steps:
      - intent: analyze_query
      - action: utter_postgresql_support_query_analyzer
      - action: action_listen

  - rule: activate analyze query form after PostgreSQL selection
    steps:
      - intent: affirm_query_analyzer
      - action: analyze_query_form
      - active_loop: analyze_query_form

  - rule: unsupported database type selected for query analyzer
    steps:
      - intent: unsupported_db_type
      - action: utter_working_on_features
      - action: action_listen

  - rule: submit analyze query form
    condition:
      - active_loop: analyze_query_form
      - slot_was_set:
          - sql_query
    steps:
      - action: analyze_query_form
      - active_loop: null
      - action: utter_ask_confirm_query_analysis
      - action: action_listen

  - rule: handle affirm for query analysis
    condition:
      - active_loop: null
      - slot_was_set:
          - connection_string  
          - sql_query
    steps:
      - intent: affirm
      - action: action_submit_query_analysis

  - rule: handle deny for query analysis
    condition:
      - active_loop: null
      - slot_was_set:
          - connection_string 
          - sql_query
    steps:
      - intent: deny
      - action: utter_query_analysis_cancelled

# ——— patch information flow ———
  - rule: Activate patch information flow
    steps:
      - intent: get_patch_information
      - action: action_ask_hostname
      - action: action_listen

  - rule: Handle hostname provided directly
    steps:
      - intent: inform_hostname
      - action: action_confirm_hostname
      - action: action_listen

  - rule: Handle hostname confirmation
    condition:
      - active_loop: null
      - slot_was_set:
          - hostname
    steps:
      - action: action_confirm_hostname
      - action: action_listen

  - rule: Handle affirm for patch information
    condition:
      - active_loop: null
      - slot_was_set:
          - hostname
    steps:
      - intent: affirm
      - action: action_get_patch_information

  - rule: Handle deny for patch information (reset hostname)
    condition:
      - active_loop: null
      - slot_was_set:
          - hostname
    steps:
      - intent: deny
      - action: action_reset_patch_form
      - action: action_ask_hostname
      - action: action_listen

  - rule: Handle help during patch flow
    condition:
      - active_loop: null
      - slot_was_set:
          - hostname
    steps:
      - intent: help
      - action: action_back_to_main_menu
      - action: utter_help
      - action: action_listen

  - rule: Handle help during patch flow (no hostname set)
    steps:
      - intent: help
      - action: utter_help
      - action: action_listen

# ——— create column flow ———
  - rule: database support notice for creating column
    steps:
      - intent: create_column
      - action: utter_postgresql_support_create_column
      - action: action_listen

  - rule: activate create column form after support affirmation
    steps:
      - intent: affirm_create_column  # Use specific intent instead of 'affirm'
      - action: create_column_form
      - active_loop: create_column_form

  - rule: unsupported database type selected for create column
    steps:
      - intent: unsupported_db_type
      - action: utter_working_on_features
      - action: action_listen

  - rule: submit create column form
    condition:
      - active_loop: create_column_form
      - slot_was_set:
          - column_constraints
    steps:
      - action: create_column_form
      - active_loop: null
      - action: action_generate_alter_query
      - action: utter_ask_confirm_column_creation
      - action: action_listen

  - rule: handle affirm for column creation
    condition:
      - active_loop: null
      - slot_was_set:
          - connection_string
          - selected_table
          - column_name
          - column_type
          - alter_query
    steps:
      - intent: affirm
      - action: action_execute_alter_query

  - rule: handle deny for column creation
    condition:
      - active_loop: null
      - slot_was_set:
          - connection_string
          - selected_table
          - column_name
          - column_type
          - alter_query
    steps:
      - intent: deny
      - action: utter_column_creation_cancelled


# ——— drop column flow ———
  - rule: database support notice for dropping column
    steps:
      - intent: drop_column
      - action: utter_postgresql_support_drop_column
      - action: action_listen

  - rule: activate drop column form after support affirmation
    steps:
      - intent: affirm_drop_column
      - action: drop_column_form
      - active_loop: drop_column_form

  - rule: unsupported database type selected for drop column
    steps:
      - intent: unsupported_db_type
      - action: utter_working_on_features
      - action: action_listen

  - rule: submit drop column form
    condition:
      - active_loop: drop_column_form
      - slot_was_set:
          - column_to_drop
    steps:
      - action: drop_column_form
      - active_loop: null
      - action: action_generate_drop_query
      - action: utter_ask_confirm_column_drop
      - action: action_listen

  - rule: handle affirm for column drop
    condition:
      - active_loop: null
      - slot_was_set:
          - connection_string
          - selected_table
          - column_to_drop
          - drop_query
    steps:
      - intent: affirm
      - action: action_execute_drop_query

  - rule: handle deny for column drop
    condition:
      - active_loop: null
      - slot_was_set:
          - connection_string
          - selected_table
          - column_to_drop
          - drop_query
    steps:
      - intent: deny
      - action: utter_column_drop_cancelled

