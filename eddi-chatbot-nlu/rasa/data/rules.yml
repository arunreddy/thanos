#      - action: utter_provide_execution_plan

  # ─── query analyzer start ───
  - rule: Initialize analyze query form
    steps:
      - intent: analyze_query
      - action: analyze_query_form
      - active_loop: analyze_query_form

  # ─── query analyzer submit ───
  - rule: Submit analyze query form
    condition:
      - active_loop: analyze_query_form
      - slot_was_set:
          - db_environment
          - db_host_endpoint
          - db_type
          - output_format
          - sql_query
    steps:
      - action: analyze_query_form
      - active_loop: null
      - action: action_analyze_query
      - action: utter_provide_execution_plan
      - intent: provide_db_host_endpoint
      - action: validate_db_host_endpoint
      - action: utter_ask_db_type
      - intent: provide_db_type
      - action: utter_ask_query_output_format
      - intent: provide_output_format
      - action: utter_ask_sql_query
      - intent: provide_sql_query
      - action: action_validate_sql
      - action: action_analyze_query
      - action: utter_provide_execution_plan

  - rule: Interrupt with help and resume flow
    condition:
      - active_loop: null
    steps:
      - intent: help
      - action: utter_help

  - rule: Help website flow
    condition:
      - active_loop: null
    steps:
      - intent: help_website
      - action: utter_help_website

